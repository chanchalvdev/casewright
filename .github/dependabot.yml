version: 2
updates:
  - package-ecosystem: gomod
    directory: /casewright
    schedule: { interval: weekly, day: monday }
    labels: ["dependencies", "area: deps", "type: chore"]
    commit-message: { prefix: "chore(deps)" }
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /casewright/web
    schedule: { interval: weekly, day: monday }
    labels: ["dependencies", "area: deps", "type: chore"]
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: ["dependencies", "area: ci", "type: ci"]
    commit-message: { prefix: "ci(deps)" }

  - package-ecosystem: docker
    directories: [/casewright, /casewright/web]
    schedule: { interval: weekly, day: monday }
    labels: ["dependencies", "area: deps", "type: chore"]
    commit-message: { prefix: "chore(deps)" }
