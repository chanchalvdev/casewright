name: Release

# Push a semver tag on master to release: git tag -a v0.4.0 -m v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: casewright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: casewright/go.mod
          cache-dependency-path: casewright/go.sum
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="casewright_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/casewright" ./cmd/casewright
          cp ../LICENSE ../README.md .env.example "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: casewright/dist/*.tar.gz
          if-no-files-found: error

  images:
    name: Image (${{ matrix.image }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - image: casewright-api
            context: casewright
          - image: casewright-web
            context: casewright/web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: GitHub release
    needs: [binaries, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag $prerelease

  # Runs only once the production environment is configured (see
  # casewright/deploy/oci/README.md) and waits for a required reviewer there.
  # Pre-releases (v1.2.0-rc1) are built but not deployed.
  deploy:
    name: Deploy to Oracle Cloud
    needs: images
    if: ${{ vars.OCI_DOMAIN != '' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.OCI_DOMAIN }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      DOMAIN: ${{ vars.OCI_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: never trust a key seen for the first time here.
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the deploy files
        run: |
          cd casewright/deploy/oci
          scp -o StrictHostKeyChecking=yes docker-compose.yml Caddyfile deploy.sh prod.env.example \
            "deploy@$OCI_HOST:casewright/"
      - name: Deploy (rolls back on a failed health check)
        run: ssh -o StrictHostKeyChecking=yes "deploy@$OCI_HOST" "cd casewright && ./deploy.sh '$GITHUB_REF_NAME'"
      - name: Smoke test through the public URL
        env:
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
        run: |
          curl -fsS -m 30 "https://$DOMAIN/health/ready"
          echo
          # One line no detection rule matches, so it exercises the LLM path.
          body='{"log":"Oct 24 10:00:00 db01 app[22]: nightly report job finished in 42s"}'
          curl -fsS -m 120 "https://$DOMAIN/api/classify" \
            -H "X-API-Key: $OCI_API_KEY" -H 'Content-Type: application/json' -d "$body" \
            | python3 -c 'import json,sys; e=json.load(sys.stdin); print(e["attack_type"], e["severity"], e.get("prompt_version")); assert e["attack_type"]'
