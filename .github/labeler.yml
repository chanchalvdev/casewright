# Path-based "area:" labels, applied by .github/workflows/pr-labeler.yml.
"area: backend":
  - changed-files:
      - any-glob-to-any-file:
          - casewright/cmd/**
          - casewright/internal/**
          - casewright/pkg/**
          - casewright/go.mod
"area: frontend":
  - changed-files:
      - any-glob-to-any-file: casewright/web/**
"area: detection":
  - changed-files:
      - any-glob-to-any-file:
          - casewright/internal/detection/**
          - casewright/rules/**
"area: ingestion":
  - changed-files:
      - any-glob-to-any-file:
          - casewright/internal/ingest/**
          - casewright/internal/parser/**
"area: ai":
  - changed-files:
      - any-glob-to-any-file:
          - casewright/internal/classifier/**
          - casewright/internal/agent/**
"area: storage":
  - changed-files:
      - any-glob-to-any-file:
          - casewright/internal/store/**
          - casewright/pkg/qdrant/**
"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .githooks/**
          - Makefile
          - "**/Dockerfile"
"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - docs/**
"area: deps":
  - changed-files:
      - any-glob-to-any-file:
          - casewright/go.sum
          - casewright/web/package-lock.json
