# Public listener (port 7860): dashboard plus the API, proxied to the Go server on
# loopback. Same routes as web/nginx.conf.template.
server {
    listen 7860;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/(api|health|docs)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Stand-in for the firewall/Slack webhooks, reachable only from inside the
# container, so approved demo actions succeed without leaving it.
server {
    listen 127.0.0.1:9000;
    server_tokens off;
    location / {
        default_type text/plain;
        return 200 "accepted by the demo stand-in (no real system was changed)\n";
    }
}
